[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "FLAME_PyTorch"
version = "0.0.1"
description = "PyTorch implementation of the 3D FLAME model."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT License"}
authors = [
    {name = "Soubhik Sanyal", email = "soubhik.sanyal@tuebingen.mpg.de"}
]
keywords = ["FLAME", "3D Face Modelling"]
classifiers = [
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.20.0",
    "torch>=1.4.0",
    "smplx>=0.1.28"
]

[project.optional-dependencies]
demo = [
    "pyrender>=0.1.39",
    "trimesh>=3.6.18",
    "typer"
]
dev = [
    "pytest>=3.0",
    "flake8>=4.0.1",
    "black>=22.10.0",
    "isort>=5.10.1"
]

[project.urls]
Source = "https://github.com/soubhiksanyal/FLAME_PyTorch"
